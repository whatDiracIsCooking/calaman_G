# The layer dropdown is the load-bearing field. It decides what verifies a
# change, and -- for the first option -- whether the change belongs in THIS
# repository at all: the vendor split lives in the WarpWraps submodule, so anything
# that has to know a `cu*` from a `hip*` name is a WarpWraps issue.
name: Feature request
description: Something to add, or a shape to change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is hard today
      description: The problem, not the solution. What are you unable to express?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would add or change, and roughly how it would be used.
    validations:
      required: true

  - type: dropdown
    id: layer
    attributes:
      label: Which layer
      description: >-
        See docs/architecture.md if this is not obvious. Note the first option:
        the CUDA/HIP split is the dependency's, so that work happens in WarpWraps
        and arrives here as a submodule bump.
      options:
        - 'deps/WarpWraps — a vendor API this project needs exposed (a WarpWraps issue)'
        - 'src/ — a LAPACK-level routine, or a change to one'
        - 'src/ — shared machinery: dispatch, layout, workspace, error handling'
        - 'test/ — a suite, or a reference comparison against CPU LAPACK'
        - 'devtools/, docker/, CI'
        - 'Docs only'
        - 'Not sure'
    validations:
      required: true

  - type: checkboxes
    id: parity
    attributes:
      label: Backend neutrality
      description: >-
        Everything under `src/` is written once against WarpWraps's `wwr*` names and
        compiles for both backends. A proposal that needs a `cu*` or `hip*`
        spelling here needs an answer for the other vendor too --
        `devtools/cross-backend-check.sh` is what catches the ones that do not
        have one.
      options:
        - label: This is backend-neutral (uses only `wwr*` names)
        - label: This needs vendor-specific code, and the proposal says what each backend does

  - type: checkboxes
    id: oracle
    attributes:
      label: How would it be verified
      description: >-
        A routine that computes numbers needs something to be right against.
        `calaman::lapack_reference` (netlib LAPACK via LAPACKE) is the oracle, and
        a suite that uses it must be conditioned on that target existing so its
        absence is a missing tier rather than a silent pass.
      options:
        - label: Comparable against reference LAPACK
        - label: No CPU counterpart — say in the proposal what else establishes correctness

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: >-
        Including "do nothing" — several things in this tree were deliberately
        left out and say so in a comment (the dispatch check not carried over from
        WarpWraps, the formatter hooks, the install tier). If one of those is what
        you are asking for, say why the stated reason no longer holds.
