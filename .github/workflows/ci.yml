# The server-side gate. The pre-push hook (devtools/prepush-tests.sh) is the
# same idea run locally and is bypassable with --no-verify; this is not.
#
# ---------------------------------------------------------------------------
# WHAT RUNS HERE, AND WHAT STILL CANNOT
# ---------------------------------------------------------------------------
# Every runner is GitHub-hosted, which for a public repository is free and
# uncapped. None of them has a GPU.
#
#   changes       one cheap job that diffs the push/PR and outputs `code`,
#                 false only when EVERY changed file is docs. The heavy job
#                 gates on it; `ci-ok` accepts its skip only when it says
#                 docs-only. So a `.md`-only PR goes green on lint+test alone.
#   lint          ruff + cmake-lint
#   python        the pytest tier, on 3.13
#   cpp (cuda)    the whole tree built for CUDA -- this project, the WarpWraps
#                 submodule, GoogleTest and every test binary -- then
#                 `ctest -LE gpu`, then an ADVISORY clang-tidy pass over
#                 src/*.cpp that cannot fail the job
#   cpp (hip)     the same shape for HIP: the whole tree through clang's
#                 -x hip front end, then the same `-LE gpu`
#   (no install-check job: the package tier is dormant, see the bottom of this
#    file)
#   ci-ok         an aggregate that fails unless every job above either
#                 succeeded or, for the gated job on a docs-only change, was
#                 skipped -- the one check name stable enough to require in a
#                 ruleset
#
# BE PRECISE ABOUT WHAT THE cpp JOBS PROVE, because "the whole tree built, then
# ctest" reads like more than it is. `test/` IS EMPTY TODAY, so what the two cpp
# legs currently prove is:
#
#   * the toolchain, the presets and the CMake wiring configure and build;
#   * the WarpWraps submodule compiles for both backends at this pin, its own
#     compile-time static_assert tier included (it is built as a subdirectory --
#     deps/CMakeLists.txt says why);
#   * nothing at all about this project's numerics, because there is none yet.
#
# As test/ fills, `-LE gpu` is what keeps these legs honest: every suite that
# touches a device carries that label and is EXCLUDED BY NAME here, because a
# hosted runner has no card. What is left after the exclusion is compile-and-link
# plus whatever runs on a CPU. NOTHING HERE TESTS GPU BEHAVIOUR, and in this
# project that means nothing here checks a single number it computes --
# `devtools/cpp-tier.sh` on a box with a card is the only thing that does, and it
# stays a human gate.
#
# The CPU reference LAPACK is in the image (docker/Dockerfile.base), so the
# oracle-based suites do compile here even though they cannot run. A configure
# log carrying "CPU reference LAPACK not found" means they were not even built --
# see devtools/config.sh, DOCTOR_REQUIRED_PATHS.
#
# WHY BOTH LEGS, when neither runs a kernel: nvcc and clang's -x hip are
# different front ends and nvcc is the more permissive one, so a whole class of
# error compiles clean under CUDA and only fails when someone builds ROCm.
# Compiling the test sources both ways is most of the value here -- which is
# why the hip leg is a full build and not the compile-time tier.
#
# A SUBMODULE BUMP IS A CODE CHANGE. Both cpp legs check out with
# `submodules: recursive`; without that, configure fails in deps/CMakeLists.txt.
#
# ---------------------------------------------------------------------------
# THE IMAGES COME FROM .github/workflows/images.yml
# ---------------------------------------------------------------------------
# Neither C++ job builds a container; both declare one. The toolchain is
# clang-20 with libc++'s module manifest, CMake 4.2 and a vendor SDK, which is
# far too much to install per run -- and re-deriving it in YAML is how it
# drifts from docker/. images.yml publishes `:cuda-ci` and `:hip-ci` to GHCR
# and this file pulls them.
#
# THE TAGS MOVE, and `container:` is resolved before any step runs, so it
# cannot be computed from the diff: a PR that edits docker/ is tested against
# the image main already published. images.yml's header says how to publish a
# branch's image first.
#
# The owner is spelled in lowercase literally. GHCR rejects an uppercase
# path and ${{ github.repository_owner }} preserves the case of the account
# name, which here has capitals -- and `container:` has no shell to lowercase
# it in. A fork with no packages of its own pulls these, which is the intended
# behaviour rather than an accident: forks get a working CI without publishing
# anything.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push to a PR cancels the previous run for that PR; main is never
  # cancelled, so every commit on it keeps a result.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The default token scope for this workflow, narrowed to what `lint` and `test`
# actually need: a checkout and nothing else. Without this they inherit the
# repository default, which can be read-WRITE.
#
# A job-level `permissions:` block REPLACES this rather than adding to it, which
# is why `cpp` spells out `contents: read` alongside the `packages: read` it
# needs to pull from GHCR.
permissions:
  contents: read

jobs:
  # Docs-only detection. Its single output `code` is `false` only when EVERY
  # file this push/PR changed is on the allowlist below; anything else -- a
  # .cu, a .cmake, a .sh, a workflow edit, a new extension -- makes it `true`.
  # The bias is deliberately toward `true`: a file the allowlist does not name
  # counts as code and builds. The expensive job (`cpp`) gates on
  # `code == 'true'`; `ci-ok` accepts its `skipped` result ONLY when `code` is
  # `false`, so the skip a real code change must never produce is still caught.
  # A submodule bump changes deps/WarpWraps, which is not on the allowlist, so it
  # counts as code -- which is right. No third-party action -- a git diff is
  # transparent and needs no pin.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The diff needs the base commit present, which a shallow clone omits.
          fetch-depth: 0
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          # base.sha on a PR; the pushed-over commit on a branch push. Empty on
          # workflow_dispatch, all-zero on a branch's very first push.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # No base to diff against (manual dispatch, or a brand-new branch):
          # build everything rather than guess what changed.
          if [ "$EVENT" = workflow_dispatch ] || [ -z "$BASE" ] || \
             [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            echo "no diff base -- building everything"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$BASE" HEAD)"
          echo "changed files:"; printf '%s\n' "$files"
          # `code` becomes true the moment one changed file is NOT docs. Keep
          # this allowlist tight -- when unsure, leave a pattern out and the file
          # counts as code. `.github/workflows/**` is intentionally absent: a CI
          # edit must run CI.
          nondoc="$(printf '%s\n' "$files" | grep -vE \
            '(\.md$|^docs/|^\.github/ISSUE_TEMPLATE/|(^|/)LICENSE$)' || true)"
          if [ -n "$files" ] && [ -z "$nondoc" ]; then
            echo "docs-only -- the cpp legs will skip"
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # --frozen: install the lock as committed, and fail rather than
      # re-resolve. A CI that silently re-resolves is not testing what you ship.
      - run: uv sync --frozen
      - run: uv run ruff check .
      # cmake-lint over the files that define every target in the tree. Comes
      # from the `cmakelang` dev dependency, so it is already in the lock;
      # configured by .cmake-format.yaml. Lint only -- the formatter is not run
      # in CI for the same reason it is not a pre-commit hook.
      - name: cmake-lint
        run: |
          uv run cmake-lint CMakeLists.txt \
            $(git ls-files '*/CMakeLists.txt' 'cmake/*.cmake')

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Match `requires-python` in pyproject.toml. It floors at 3.13 with no
        # ceiling, so 3.13 is the one version tested; add the ceiling here when a
        # newer Python is supported. Kept a matrix so that is a one-line edit.
        python: ["3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      # -rs prints skip reasons: a suite that degrades-to-skip when a tool is
      # missing looks green while testing nothing, and the log is the only
      # place that shows it.
      - name: python tier
        run: uv run pytest -n auto -rs

  cpp:
    # An explicit name, because the default for a matrix job is built from ALL
    # of its matrix values -- this one read `cpp (cuda, cuda-ci, ci-cuda,
    # --tidy)` until this line existed, and every key added below silently
    # rewrote it. See ci-ok at the bottom of this file for why that matters.
    name: cpp (${{ matrix.backend }})
    # After lint, so a ruff finding does not cost a 20-minute module build
    # before it is reported. On `changes` too, so a docs-only PR skips this
    # entirely -- `ci-ok` knows the skip is intentional. `if` is evaluated
    # against the whole matrix, so a false skips both legs.
    needs: [lint, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: cuda
            image: cuda-ci
            preset: ci-cuda
            # clang-tidy, on this leg only. .clang-tidy is real configuration
            # and cpp-tier.sh has had --tidy from the start, but nothing ran it
            # anywhere -- neither a hook nor CI -- which is the same dead-check
            # failure mode as a preset no one exercises.
            #
            # It rides the build that is already happening: it lints the five
            # src/*.cpp implementation units out of this tree's
            # compile_commands.json, so the marginal cost is clang-tidy itself.
            # One leg because the findings would otherwise be reported twice.
            #
            # IT IS ADVISORY BY CONSTRUCTION. cpp-tier.sh never lets it change
            # the exit code (the tree is not tidy-clean yet, and clang-tidy's
            # C++23-module support is still incomplete enough to emit the odd
            # bogus diagnostic), so read it in the uploaded log rather than in
            # this job's colour. Promote it to a gate only once the tree is
            # clean AND the module diagnostics are trustworthy.
            tidy: '--tidy'
          - backend: hip
            image: hip-ci
            preset: ci-hip
            tidy: ''
    container:
      # `calaman`, not `calaman_g`: the tag prefix comes from PROJECT_NAME in
      # devtools/config.sh, which is what images.yml publishes under.
      image: ghcr.io/whatdiraciscooking/calaman:${{ matrix.image }}
      # The image's own USER is `ubuntu` (uid 1000) and the runner creates
      # /__w owned by someone else, so the default user cannot write its own
      # workspace. Running as root inside a throwaway container is the usual
      # answer and costs nothing here.
      options: --user root
    steps:
      - uses: actions/checkout@v7
        with:
          # deps/WarpWraps is a submodule and every module here imports it; without
          # this, configure dies in deps/CMakeLists.txt naming a missing
          # directory rather than a missing checkout.
          submodules: recursive

      # cpp-tier.sh puts `git rev-parse --short HEAD` in its log name, and git
      # refuses to read a repository owned by a different uid. Without this the
      # job dies on "detected dubious ownership", which reads like a checkout
      # problem rather than a container one.
      - name: trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # A C++23 named-module build is expensive enough that a cold cache
      # dominates the job. SCCACHE_DIR has to live INSIDE the workspace: the
      # image points it at /home/ubuntu/.sccache, which is not the mounted
      # directory, so actions/cache on the host would never see it.
      #
      # NOTE this cached nothing while it named ccache: ccache declares the
      # module-interface compile uncacheable (two outputs from one invocation),
      # and nothing wired it in as a compiler launcher in the first place. The
      # launcher now lives in CMakeLists.txt behind find_program, so until
      # images.yml republishes the -ci images with sccache in them, this job
      # finds no sccache, compiles everything, and saves an empty directory --
      # the intended degradation rather than a failure.
      - uses: actions/cache@v6
        with:
          path: .sccache
          key: sccache-${{ matrix.backend }}-${{ github.sha }}
          restore-keys: |
            sccache-${{ matrix.backend }}-

      # BUILD_JOBS rather than Ninja's default of cores+2. A hosted runner is
      # 4 vCPU / 16GB and a module build is memory-hungry per job (the scanner
      # plus a BMI cache); an OOM-killed compiler surfaces as a bare
      # `ninja: build stopped` with nothing about memory in it. Lower this
      # first if that appears.
      #
      # The preset is passed explicitly, so cpp-tier.sh moves the TEST preset
      # with it -- ci-cuda excludes the `gpu` label, ci-hip includes only
      # `compile_time`.
      - name: cpp tier
        env:
          BUILD_JOBS: '4'
        run: |
          export SCCACHE_DIR="$GITHUB_WORKSPACE/.sccache"
          devtools/cpp-tier.sh --preset ${{ matrix.preset }} ${{ matrix.tidy }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cpp-tier-${{ matrix.backend }}
          path: .slow-tier-reports/
          # SLOW_TIER_REPORTS is a dotdir, and upload-artifact excludes hidden
          # paths by default (since v4.4) -- without this the reports, including
          # the cuda leg's advisory clang-tidy log, silently upload nothing.
          include-hidden-files: true

  # NO install-check JOB, DELIBERATELY. The package tier is dormant:
  # CALAMAN_INSTALL is OFF because WarpWraps is consumed with add_subdirectory, so
  # this project's export set would name targets no installed package provides
  # (docs/architecture.md section 2), and there is no example/consumer to build
  # against a prefix (example/README.md). devtools/install-check.sh exits 2 --
  # "could not run" -- on either, so a job here would be red for a reason that is
  # not a regression, and making it green by tolerating exit 2 would be a check
  # that proves nothing.
  #
  # RESTORE IT in the commit that flips CALAMAN_INSTALL ON: re-add the job (its
  # shape is in WarpWraps's own ci.yml, which this file came from -- a container leg
  # running `devtools/install-check.sh --preset ci-cuda --no-run`), and add
  # `install-check` back to BOTH `needs:` and the GATED set in ci-ok below.
  # Without that second half nothing gates it.

  # THE AGGREGATE GATE. One job whose only purpose is to be the single required
  # status check in a branch ruleset.
  #
  # It exists because every other check name in this file is GENERATED and
  # therefore moves. `test (3.13)` carries a Python version that will be bumped.
  # `cpp`'s name was assembled from all of its matrix values until the `name:`
  # line above existed -- adding the `tidy:` key rewrote it from
  # `cpp (cuda, cuda-ci, ci-cuda)` to `cpp (cuda, cuda-ci, ci-cuda, --tidy)`
  # without touching anything that looked like a name.
  #
  # A ruleset matches a required check by NAME, and a required name that nothing
  # reports blocks the pull request FOREVER, displaying "Expected -- waiting for
  # status to be reported". That reads like GitHub being slow rather than like a
  # stale config, which is what makes it expensive. So pin this name and no
  # other: it is stable by construction.
  #
  # THE INVARIANT IT CREATES: a job added to this file must be added to `needs:`
  # below, or nothing gates it. There is no `needs: *`, so the list is spelled
  # out and keeping it current is a human job -- that is the whole cost of the
  # pattern. A job that is allowed to skip must ALSO be placed in the gated set
  # in the script below, or its skip fails this gate.
  ci-ok:
    name: ci-ok
    # Load-bearing. Without it this job is SKIPPED as soon as a need fails, and
    # a skipped required check never reports -- so a red `cpp` leg would block
    # the merge with no red gate explaining why. With it, the job runs and fails
    # loudly instead.
    if: always()
    needs: [changes, lint, test, cpp]
    runs-on: ubuntu-latest
    steps:
      - name: every required job passed
        env:
          # Through the environment rather than interpolated into the script
          # body. Job results and `code` are fixed enums, so nothing can be
          # injected today -- but pasting ${{ }} into a `run:` is the habit
          # worth not forming.
          DETAIL: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
          # Always-required set. `changes` is here too: if IT failed, `code` is
          # empty and every gate below would misread -- so its own failure must
          # fail the gate first.
          ALWAYS: >-
            changes:${{ needs.changes.result }}
            lint:${{ needs.lint.result }}
            test:${{ needs.test.result }}
          # Gated set: required to succeed when code changed, but a `skipped`
          # result is acceptable on a docs-only change (code=false). Any other
          # result -- failure, cancelled -- still fails, on any change.
          GATED: >-
            cpp:${{ needs.cpp.result }}
        run: |
          echo "$DETAIL"
          fail=0
          # Always-required: nothing but success passes. Empty results (which is
          # what emptying `needs:` above would produce) are not "success", so the
          # gate cannot pass vacuously.
          for pair in $ALWAYS; do
            name=${pair%%:*}; result=${pair#*:}
            if [ "$result" != success ]; then
              echo "ci-ok: $name did not succeed ($result)" >&2
              fail=1
            fi
          done
          # Gated: success always passes; skipped passes ONLY on a docs-only
          # change. A job that did not run proved nothing, so its skip is
          # tolerated only when `changes` said there was nothing to prove.
          for pair in $GATED; do
            name=${pair%%:*}; result=${pair#*:}
            if [ "$result" = success ]; then
              continue
            fi
            if [ "$result" = skipped ] && [ "$CODE" = false ]; then
              echo "ci-ok: $name skipped -- docs-only change, expected"
              continue
            fi
            echo "ci-ok: $name is '$result' (code=$CODE) -- not acceptable" >&2
            fail=1
          done
          if [ "$fail" -ne 0 ]; then
            echo "ci-ok: a required job did not pass -- see the detail above" >&2
            exit 1
          fi
          echo "ci-ok: all required jobs passed (code=$CODE)"
